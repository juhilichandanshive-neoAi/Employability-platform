cross_validation:
  n_splits: 5
  shuffle: true
  random_state: 42

models:
  random_forest:
    n_estimators: 200
    max_depth: 10
    random_state: 42
    n_jobs: -1


  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    random_state: 42
    n_jobs: -1