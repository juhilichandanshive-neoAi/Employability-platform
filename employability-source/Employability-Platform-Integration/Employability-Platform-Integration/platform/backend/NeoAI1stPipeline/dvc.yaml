stages:
  preprocess:
    cmd: python -m src.neoai.pipelines.preprocess_pipeline
    deps:
      - data/raw/Merged_industry_jobs_industry_jobs.csv
      - src/neoai/data/ingestion.py
      - src/neoai/data/preprocessing.py
      - src/neoai/features/build_features.py
      - src/neoai/pipelines/preprocess_pipeline.py
    outs:
      - data/processed/Cleaned_Merged_Industry_Jobs.csv

  train:
    cmd: python -m src.neoai.models.train_salary
    deps:
      - data/processed/Cleaned_Merged_Industry_Jobs.csv
      - src/neoai/models/train_salary.py
    params:
      - params.yaml:
          - models.random_forest
          - models.xgboost
    outs:
      - models/best_salary_model.pkl
    metrics:
      - reports/evaluation/model_comparison.csv

  cross_validate:
    cmd: python -m src.neoai.models.cross_val_score
    deps:
      - data/processed/Cleaned_Merged_Industry_Jobs.csv
      - src/neoai/models/cross_val_score.py
      - src/neoai/features/build_features.py
      - src/neoai/models/transformers.py
    params:
      - params.yaml:
          - models.random_forest
          - models.xgboost
          - cross_validation
    outs:
      - models/best_salary_model_cv.pkl
    metrics:
      - reports/evaluation/cross_validation_results.csv

  remove_salary_outliers:
    cmd: python -m src.neoai.data.remove_salary_outliers
    deps:
      - data/processed/Cleaned_Merged_Industry_Jobs.csv
      - src/neoai/data/remove_salary_outliers.py
    outs:
      - data/processed/Cleaned_Merged_Industry_Jobs_Zero_Outliers.csv

  train_zero_outliers:
    cmd: python -m src.neoai.models.train_salary_zero_outliers
    deps:
      - data/processed/Cleaned_Merged_Industry_Jobs_Zero_Outliers.csv
      - src/neoai/models/train_salary_zero_outliers.py
    params:
      - params.yaml:
          - models.random_forest
          - models.xgboost
    outs:
      - models/best_salary_model_zero_outliers.pkl
    metrics:
      - reports/evaluation/model_comparison_zero_outliers.csv

  cross_validate_zero_outliers:
    cmd: python -m src.neoai.models.cross_val_score_zero_outliers
    deps:
      - data/processed/Cleaned_Merged_Industry_Jobs_Zero_Outliers.csv
      - src/neoai/models/cross_val_score_zero_outliers.py
      - src/neoai/features/build_features.py
      - src/neoai/models/transformers.py
    params:
      - params.yaml:
          - models.random_forest
          - models.xgboost
          - cross_validation
    outs:
      - models/best_salary_model_zero_outliers_cv.pkl
    metrics:
      - reports/evaluation/cross_validation_results_zero_outliers.csv

  compare_validation_results:
    cmd: python -m src.neoai.models.compare_validation_results
    deps:
      - reports/evaluation/cross_validation_results.csv
      - reports/evaluation/cross_validation_results_zero_outliers.csv
      - src/neoai/models/compare_validation_results.py
    outs:
      - reports/evaluation/combined_cross_validation_results.csv

  visualize_validation_results:
    cmd: python -m src.neoai.models.visualize_validation_results
    deps:
      - reports/evaluation/combined_cross_validation_results.csv
      - src/neoai/models/visualize_validation_results.py
    outs:
      - reports/visualizations/mean_r2_comparison.png
      - reports/visualizations/fold_r2_comparison.png
      - reports/visualizations/best_model_comparison.png

  save_final_model:
    cmd: python -m src.neoai.models.save_final_model
    deps:
      - models/best_salary_model_zero_outliers_cv.pkl
      - src/neoai/models/save_final_model.py
    outs:
      - models/final_salary_model.pkl