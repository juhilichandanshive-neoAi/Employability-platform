<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EmployaAI Student Employability Portal Illustration">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Shapes -->
  <circle cx="360" cy="110" r="85" fill="#A78BFA" fill-opacity="0.18"/>
  <circle cx="100" cy="280" r="95" fill="#6366F1" fill-opacity="0.15"/>
  <path d="M40,60 Q80,20 140,50 T240,40" stroke="#DDD6FE" stroke-opacity="0.2" stroke-width="2" fill="none" stroke-dasharray="4 6"/>

  <!-- Decorative Plant / Foliage in Pot -->
  <g transform="translate(350, 240)">
    <!-- Pot -->
    <path d="M12,70 L38,70 L44,110 L6,110 Z" fill="#1E1638" stroke="#A78BFA" stroke-width="2"/>
    <!-- Leaves -->
    <path d="M25,70 C10,35 -5,40 5,15 C20,35 25,60 25,70 Z" fill="#FFFFFF" fill-opacity="0.85" stroke="#4C1D95" stroke-width="1.5"/>
    <path d="M25,70 C40,40 60,45 50,18 C35,38 27,62 25,70 Z" fill="#DDD6FE" fill-opacity="0.8" stroke="#4C1D95" stroke-width="1.5"/>
    <path d="M25,70 C28,30 38,10 25,0 C15,20 22,50 25,70 Z" fill="#FFFFFF" fill-opacity="0.95" stroke="#4C1D95" stroke-width="1.5"/>
  </g>

  <!-- Big Central Career Document / Employability Card -->
  <g transform="translate(145, 175)" filter="url(#softShadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="180" height="175" rx="16" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="15" y="18" width="55" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.85"/>
    <line x1="80" y1="23" x2="165" y2="23" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Code / Data lines -->
    <line x1="15" y1="46" x2="165" y2="46" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="15" y1="62" x2="140" y2="62" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="78" x2="155" y2="78" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Verified Badge pill inside doc -->
    <rect x="15" y="100" width="82" height="22" rx="11" fill="url(#purpleGlow)"/>
    <circle cx="26" cy="111" r="4.5" fill="#FFFFFF"/>
    <line x1="36" y1="111" x2="85" y2="111" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="15" y1="136" x2="120" y2="136" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="150" x2="95" y2="150" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Skill Magnifier / Target Search Circle (Inspired by Reference Image 3) -->
  <g transform="translate(180, 205)">
    <circle cx="25" cy="25" r="28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.95"/>
    <circle cx="25" cy="25" r="21" fill="none" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    <circle cx="25" cy="25" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
    <line x1="45" y1="45" x2="68" y2="68" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Student 1 (Sitting on top of document with Laptop) -->
  <g transform="translate(225, 78)">
    <!-- Head -->
    <circle cx="65" cy="22" r="13" fill="#FFFFFF" stroke="#1E1638" stroke-width="2"/>
    <!-- Hair -->
    <path d="M54,20 C54,10 65,8 74,12 C78,14 78,22 75,25 C72,21 68,20 62,21 Z" fill="#1E1638"/>
    <!-- Body / Torso -->
    <path d="M52,35 C42,42 40,65 42,82 L78,82 C82,65 80,42 68,35 Z" fill="#FFFFFF" stroke="#1E1638" stroke-width="2.5"/>
    <!-- Laptop -->
    <path d="M72,72 L102,68 L104,82 L74,84 Z" fill="#1E1638"/>
    <path d="M92,50 L102,68 L74,72 L72,54 Z" fill="#EDE9FE" stroke="#1E1638" stroke-width="2"/>
    <polygon points="76,57 90,55 98,66 76,68" fill="#7C3AED" opacity="0.8"/>
    <!-- Arms -->
    <path d="M56,45 C65,55 78,65 86,68" fill="none" stroke="#1E1638" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs seated -->
    <path d="M48,82 L86,82 C98,82 108,94 114,108" fill="none" stroke="#1E1638" stroke-width="6" stroke-linecap="round"/>
    <!-- Shoes -->
    <path d="M110,108 L126,115 L124,120 L108,114 Z" fill="#1E1638"/>
  </g>

  <!-- Student 2 (Walking with smartphone and backpack) -->
  <g transform="translate(82, 140)">
    <!-- Backpack -->
    <rect x="30" y="70" width="18" height="34" rx="8" fill="#7C3AED" stroke="#1E1638" stroke-width="2"/>
    <!-- Head -->
    <circle cx="58" cy="30" r="14" fill="#FFFFFF" stroke="#1E1638" stroke-width="2.5"/>
    <!-- Hair -->
    <path d="M46,28 C46,15 58,14 68,18 C72,20 72,28 68,32 C65,28 60,27 54,28 Z" fill="#1E1638"/>
    <!-- Torso -->
    <path d="M46,44 L70,44 L68,98 L44,98 Z" fill="#FFFFFF" stroke="#1E1638" stroke-width="2.5"/>
    <!-- Arm holding phone -->
    <path d="M60,54 L40,78 L26,72" fill="none" stroke="#1E1638" stroke-width="3" stroke-linecap="round"/>
    <!-- Smartphone -->
    <rect x="20" y="66" width="10" height="18" rx="2" fill="#7C3AED" stroke="#1E1638" stroke-width="1.5" transform="rotate(-15 22 70)"/>
    <!-- Walking Legs -->
    <path d="M52,98 L40,148 L28,198" fill="none" stroke="#1E1638" stroke-width="6" stroke-linecap="round"/>
    <path d="M60,98 L76,145 L88,198" fill="none" stroke="#1E1638" stroke-width="6" stroke-linecap="round"/>
    <!-- Shoes -->
    <path d="M22,198 L36,198 L38,206 L18,206 Z" fill="#1E1638"/>
    <path d="M82,198 L98,198 L100,206 L80,206 Z" fill="#1E1638"/>
  </g>

  <!-- Floating Sparkles & Career Elements -->
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M70,75 L73,82 L80,85 L73,88 L70,95 L67,88 L60,85 L67,82 Z"/>
    <path d="M390,70 L392,75 L397,77 L392,79 L390,84 L388,79 L383,77 L388,75 Z"/>
    <circle cx="340" cy="180" r="3.5" fill="#DDD6FE"/>
    <circle cx="120" cy="120" r="4" fill="#A78BFA"/>
  </g>
</svg>
